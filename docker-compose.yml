# Local development services: Postgres (app data + auth) and Mailpit (catches magic-link emails).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: devops
      POSTGRES_DB: devops_learning
    ports:
      - "127.0.0.1:5433:5432" # localhost only
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devops_learning"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      # Bound to localhost: anyone who can open Mailpit can read magic links.
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI to read emails

volumes:
  postgres-data:
